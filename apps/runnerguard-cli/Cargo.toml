[package]
name = "runnerguard-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "runnerguard command-line interface"

[[bin]]
name = "runnerguard"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
runnerguard-core = { path = "../../crates/runnerguard-core" }
runnerguard-model = { path = "../../crates/runnerguard-model" }
runnerguard-config = { path = "../../crates/runnerguard-config" }
runnerguard-report = { path = "../../crates/runnerguard-report" }
runnerguard-tui = { path = "../../crates/runnerguard-tui", optional = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
default = []
tui = ["dep:runnerguard-tui"]