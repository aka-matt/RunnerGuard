name: examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  examples:
    name: examples smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-examples-${{ hashFiles('**/Cargo.lock') }}
      - name: Run parser example
        run: |
          cargo run -p runnerguard-mule-parser --example parse_project -- \
            ./fixtures/mule-project-basic --output ./tmp/parsed
      - name: Run rule engine example
        run: |
          cargo run -p runnerguard-rule-engine --example evaluate_rules -- \
            ./tmp/parsed/project.json ./rules/basic.json
      - name: Run AI example
        run: |
          cargo run -p runnerguard-ai --example parse_mock_response -- \
            ./fixtures/ai-responses/valid.json
